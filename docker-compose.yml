


services:
  postgres:
    image: postgres:16

    container_name: epigraph-postgres

    restart: always

    environment:
      POSTGRES_USER: epigraph
      POSTGRES_PASSWORD: epigraph123
      POSTGRES_DB: epigraph_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: epigraph-redis

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: